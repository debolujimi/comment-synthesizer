<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eskom Response Chat</title>
    <style>
      body {
        margin: 0;
        background: #f4f7fb;
        font-family: Arial, sans-serif;
      }
      .app {
        max-width: 760px;
        margin: 40px auto;
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .messages {
        background: #f9fbfd;
        border: 1px solid #dfeaf2;
        border-radius: 12px;
        min-height: 220px;
        max-height: 400px;
        overflow-y: auto;
        padding: 16px;
      }
      .message {
        margin-bottom: 12px;
        padding: 10px 14px;
        border-radius: 10px;
      }
      .user {
        background: #dff5ef;
        margin-left: 30px;
      }
      .bot {
        background: #eaf3f8;
        margin-right: 30px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 16px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #d9e2ec;
      }
      button {
        margin-top: 12px;
        background: #29ab87;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Eskom Response Assistant</h1>
      <div id="messages" class="messages"></div>
      <input id="messageInput" type="text" placeholder="Type a message..." />
      <button id="sendButton">Send</button>
    </div>

    <script>
      const messages = document.getElementById('messages');
      const input = document.getElementById('messageInput');
      const button = document.getElementById('sendButton');

      function addMessage(text, type) {
        const el = document.createElement('div');
        el.className = 'message ' + type;
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';

        try {
          const res = await fetch('http://127.0.0.1:8000/respond', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });

          const data = await res.json();
          addMessage(data.response, 'bot');
        } catch (error) {
          addMessage('Could not connect to the API. Start the backend first.', 'bot');
        }
      }

      button.addEventListener('click', sendMessage);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
      });

      addMessage('Hello! Type a message about loadshedding, outages, power, or billing.', 'bot');
    </script>
  </body>
</html>
